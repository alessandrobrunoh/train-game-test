[package]
name = "sim-laya"
edition.workspace = true
version.workspace = true

[dependencies]
sim = { path = "../sim" }
# --- Modello Laya vero (feature `laya`): candle + tokenizers + download da Hugging Face ---
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
# 0.22 (non 0.23): è la stessa versione che candle-core si porta dietro, così si compila una volta sola.
tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.5.0", optional = true, default-features = false, features = ["ureq"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Solo per rileggere il JSONL del dataset nei test (`tests/dataset.rs`).
serde_json = "1"

[features]
default = []
# Modello Laya in-process con candle (CPU). Pesante: resta fuori da `cargo test --workspace`.
laya = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:hf-hub", "dep:serde", "dep:serde_json"]
# Laya sulla GPU Apple (Metal). Implica `laya`.
metal = ["laya", "candle-core/metal", "candle-nn/metal"]
# BLAS di Accelerate per il percorso CPU su macOS. Implica `laya`.
accelerate = ["laya", "candle-core/accelerate", "candle-nn/accelerate"]

[[example]]
name = "laya_bench"
required-features = ["laya"]
