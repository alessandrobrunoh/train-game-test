[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-laya", "crates/game", "crates/history", "crates/llm"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Bevy: compila le dipendenze ottimizzate anche in debug, altrimenti il gioco è lentissimo
[profile.dev]
opt-level = 1

# Niente debuginfo per le dipendenze: target/ molto più piccolo, i backtrace del nostro codice restano completi
[profile.dev.package."*"]
opt-level = 3
debug = false
